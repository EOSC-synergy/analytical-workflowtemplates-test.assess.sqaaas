config:
  credentials:
  - id: https://gitlab.a.incd.pt/palomoIFCA/analytical-workflowtemplates-test
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    gitlab.a.incd.pt/palomoIFCA/analytical-workflowtemplates-test:
      branch: main
      credential_tmp: true
      credentials_id: https://gitlab.a.incd.pt/palomoIFCA/analytical-workflowtemplates-test
      repo: https://gitlab.a.incd.pt/palomoIFCA/analytical-workflowtemplates-test
